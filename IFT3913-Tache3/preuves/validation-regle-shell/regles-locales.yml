rules:
  - id: java.lang.security.ift3913.dynamic-shell-command
    languages: [java]
    severity: ERROR
    message: >-
      Une commande dynamique est interpretee par un shell. Des arguments non
      fiables peuvent devenir des instructions. Passer les arguments separement,
      sans shell, ou utiliser une liste blanche adaptee au contexte.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: new ProcessBuilder($SHELL, $OPTION, $COMMAND, ...)
          - patterns:
              - pattern: $PB.command($SHELL, $OPTION, $COMMAND, ...)
              - pattern-inside: |
                  $TYPE $PB = new ProcessBuilder(...);
                  ...
      - metavariable-regex:
          metavariable: $SHELL
          regex: '"(?:/(?:usr/)?bin/)?(?:sh|bash|dash|ksh|zsh|cmd(?:\.exe)?)"'
      - metavariable-regex:
          metavariable: $OPTION
          regex: '"(?:-c|/c)"'
      - metavariable-pattern:
          metavariable: $COMMAND
          patterns:
            - pattern-not: '"..."'
